<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=<device-width>, initial-scale=1.0">
	<title>Document</title>

	<style>
		body { font-family: sans-serif; }
		div { color:aquamarine; }
		.quote { font-size: 4rem; }
		.source { font-style: italic; }
		.important { background: magenta; }

		.citation {
			margin: 4rem;
			padding: 2rem;
			border: 1px solid darkblue;
			border-radius: 1rem;
			aspect-ratio: 16/9;
		}

		#machin { background: pink; }
	</style>

</head>
<body>

	<div class="citation">
		<div class="quote important">"As long as there are people, there will be user experience, and user interface designers."</div>
		<div class="source">-Steve McGarry</div>
	</div>
	
	<div class="citation" id="machin">
		<div class="quote">Hello.</div>
		<div class="class">-Steve</div>
	</div>
</body>
</html>
